<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผนการดำเนินงานรวม — กบรส. & PRI & ส่วนตัว (Real-time)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');
:root {
  --ink: #16233B; --ink-soft: #4A5773; --bg: #F3F5F9; --surface: #FFFFFF;
  --indigo: #3A2E6E; --indigo-deep: #241C4D; --indigo-soft: #EDEAFB;
  --line: #E1E4EC; --line-soft: #EEF0F5; --cyan: #22D3EE; --danger: #E23D5B;
  --danger-soft: #FDEAEE; --radius: 10px; --sticky-bg: #FAFBFD;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: 'Sarabun', 'Noto Sans Thai', sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; }
#app { display: flex; flex-direction: column; min-height: 100vh; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 22px; background: linear-gradient(135deg, var(--indigo-deep), var(--indigo)); color: #fff; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 42px; height: 42px; border-radius: 10px; background: var(--cyan); color: var(--indigo-deep); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; line-height: 1.1; letter-spacing: 0.5px; }
.brand-title { font-weight: 700; font-size: 18px; line-height: 1.2; }
.brand-sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }
.tabs { display: flex; align-items: center; gap: 6px; padding: 10px 18px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { position: relative; border: 1px solid var(--line); background: var(--bg); color: var(--ink-soft); padding: 8px 32px 8px 14px; border-radius: 999px; font-family: inherit; font-size: 13.5px; cursor: pointer; white-space: nowrap; transition: all .15s ease; display: flex; align-items: center; gap: 6px; }
.tab:hover { border-color: var(--indigo); color: var(--indigo); }
.tab.active { background: var(--indigo); border-color: var(--indigo); color: #fff; font-weight: 600; }
.tab-add { padding: 8px 16px; border-style: dashed; }
.tab-del { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 15px; line-height: 1; padding: 2px 5px; border-radius: 50%; opacity: 0.6; }
.tab-del:hover { opacity: 1; background: rgba(0,0,0,0.15); }
.tab-color-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 13px; line-height: 1; padding: 2px 5px; border-radius: 50%; opacity: 0.6; cursor: pointer; }
.tab-color-btn:hover { opacity: 1; background: rgba(0,0,0,0.15); }
.badge-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; line-height: 1; margin-left: 4px; }
.badge-tag.work { background: #E0F2FE; color: #0369A1 !important; border: 1px solid #BAE6FD; }
.badge-tag.extra { background: #FEF3C7; color: #D97706 !important; border: 1px solid #FDE68A; }
.badge-tag.personal { background: #F3E8FF; color: #7E22CE !important; border: 1px solid #E9D5FF; }
.content { padding: 18px 22px 40px; flex: 1; }
.toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 12px; }
.proj-title { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.proj-title h2 { margin: 0; font-size: 19px; font-weight: 700; color: var(--indigo-deep); }
.ghost-btn, .primary-btn, .danger-btn, .icon-btn, .zoom-btn { font-family: inherit; border-radius: 8px; cursor: pointer; font-size: 13px; border: 1px solid var(--line); background: #fff; padding: 7px 12px; color: var(--ink-soft); transition: all .12s ease; }
.ghost-btn:hover { border-color: var(--indigo); color: var(--indigo); }
.primary-btn { background: var(--indigo); border-color: var(--indigo); color: #fff; font-weight: 600; }
.primary-btn:hover { background: var(--indigo-deep); }
.danger-btn { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); font-weight: 600; }
.danger-btn:hover { background: var(--danger); color: #fff; }
.zoom-controls, .filter-controls, .mode-controls { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); padding: 4px; border-radius: 999px; }
.filter-controls, .mode-controls { padding: 4px 10px; font-size: 12.5px; color: var(--ink-soft); }
.zoom-label { font-size: 12.5px; color: var(--ink-soft); padding: 0 6px 0 8px; }
.zoom-btn { border-radius: 999px; border-color: transparent; padding: 6px 14px; }
.zoom-btn.active { background: var(--indigo-soft); color: var(--indigo); font-weight: 600; }
.today-btn { border-color: var(--line); }
.filter-controls input[type="date"] { border: none; outline: none; background: transparent; font-family: inherit; font-size: 12.5px; color: var(--ink); cursor: pointer; }
.legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
.legend-label { font-size: 12.5px; color: var(--ink-soft); }
.legend-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-soft); }
.legend-chip i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.edit-colors-btn { font-size: 11px; padding: 4px 8px; margin-left: 8px; }
.gantt-scroll { overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); max-height: 72vh; }
.gantt-inner { position: relative; min-width: max-content; }
.gantt-header { position: sticky; top: 0; z-index: 20; background: var(--sticky-bg); }
.header-row { display: flex; }
.row-label { position: sticky; left: 0; z-index: 10; width: 220px; min-width: 220px; max-width: 220px; background: #FAFBFD; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line-soft); display: flex; align-items: stretch; padding: 0; font-size: 13px; }
.corner { z-index: 30; font-weight: 700; color: var(--indigo-deep); background: var(--indigo-soft); border-bottom: 1px solid var(--line); padding: 6px 10px; display: flex; align-items: center; }
.dept-info { flex: 1; padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; gap: 4px; border-right: 1px solid var(--line-soft); min-width: 0; }
.dept-name { font-weight: 600; color: var(--ink); line-height: 1.2; word-break: break-word; }
.dept-ctrls { display: flex; gap: 4px; flex-wrap: wrap; }
.dept-ctrls .icon-btn { padding: 3px 7px; font-size: 11px; }
.dept-row-names { width: 76px; flex-shrink: 0; display: flex; flex-direction: column; background: #FAFAFD; }
.row-name-cell { height: 32px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; justify-content: space-between; padding: 0 6px; font-size: 11px; color: var(--ink-soft); cursor: pointer; transition: all 0.15s ease; }
.row-name-cell:hover { background: var(--indigo-soft); color: var(--indigo); font-weight: 600; }
.row-name-cell:last-child { border-bottom: none; }
.r-name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.row-track { position: relative; display: flex; }
.hdr-seg { border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--ink-soft); flex-shrink: 0; overflow: hidden; white-space: nowrap; }
.year-seg { background: var(--indigo-soft); color: var(--indigo-deep); font-weight: 700; height: 30px; }
.month-seg { background: #fff; height: 26px; }
.week-seg { background: #fbfbfd; height: 22px; font-size: 10.5px; color: #98A2B8; }
.day-seg { height: 30px; flex-direction: column; gap: 0; background: #fff; font-size: 10px; color: #98A2B8; line-height: 1.1; }
.day-seg.weekend { background: #FBF6EE; color: #C08A2E; }
.day-seg .day-num { font-weight: 700; font-size: 11.5px; color: var(--ink); }
.day-seg.weekend .day-num { color: #C08A2E; }
.gantt-body { position: relative; min-width: max-content; }
.dept-block { display: flex; border-bottom: 2px solid var(--line); min-width: max-content; width: 100%; align-items: stretch; }
.dept-rows { display: flex; flex-direction: column; flex: 1; }
.subrow { position: relative; height: 32px; box-sizing: border-box; border-bottom: 1px solid var(--line-soft); cursor: pointer; background-image: repeating-linear-gradient(to right, transparent, transparent 51px, var(--line-soft) 51px, var(--line-soft) 52px); z-index: 1; }
.subrow:last-child { border-bottom: none; }
.subrow:hover { background-color: #FAFAFE; }
.act-bar { position: absolute; top: 4px; height: 24px; border-radius: 6px; color: #14213A; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; padding: 0 8px; overflow: hidden; white-space: nowrap; box-shadow: 0 1px 2px rgba(20,33,58,0.25); cursor: pointer; z-index: 2; user-select: none; }
.act-bar.draggable { cursor: grab; border: 1.5px dashed rgba(255,255,255,0.7); }
.act-bar.draggable:active { cursor: grabbing; }
.act-bar:hover { filter: brightness(1.06); box-shadow: 0 2px 6px rgba(20,33,58,0.35); z-index: 3; }
.row-del-btn { position: absolute; right: 4px; top: 4px; width: 18px; height: 18px; border-radius: 50%; border: none; background: var(--line); color: var(--ink-soft); font-size: 12px; line-height: 1; cursor: pointer; z-index: 4; opacity: 0.5; }
.row-del-btn:hover { opacity: 1; background: var(--danger); color: #fff; }
.gantt-grid-overlay { position: absolute; top: 0; bottom: 0; right: 0; left: 220px; pointer-events: none; z-index: 15; }
.today-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); }
.today-line::before { content: 'วันนี้'; position: absolute; top: 2px; left: 4px; font-size: 11px; color: var(--danger); font-weight: 700; background: rgba(255,255,255,0.8); padding: 0 4px; border-radius: 4px; }
.empty-hint { padding: 30px; text-align: center; color: var(--ink-soft); font-size: 13.5px; }
.modal-overlay { position: fixed; inset: 0; background: rgba(20,25,45,0.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: #fff; border-radius: 14px; padding: 22px 24px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.modal h3 { margin: 0 0 14px; color: var(--indigo-deep); font-size: 17px; }
.modal-desc { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 16px; }
.field-label { display: block; font-size: 12.5px; font-weight:600; color: var(--ink-soft); margin: 12px 0 5px; }
.text-input { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); font-family: inherit; font-size: 13.5px; }
textarea.text-input { resize: vertical; min-height: 60px; }
.text-input:focus { outline: 2px solid var(--cyan); border-color: var(--cyan); }
.color-picker { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.color-swatch { width: 26px; height: 26px; border-radius: 7px; cursor: pointer; border: 2px solid transparent; }
.color-swatch.selected { border-color: var(--indigo-deep); box-shadow: 0 0 0 2px #fff inset; }
.modal-actions { display: flex; gap: 8px; margin-top: 24px; justify-content: flex-end; }
@media (max-width: 720px) {
  .topbar { flex-direction: column; align-items: flex-start; gap: 10px; }
  .row-label { width: 160px; min-width: 160px; max-width: 160px; }
  .gantt-grid-overlay { left: 160px; }
  .dept-row-names { width: 56px; }
  .row-name-cell { font-size: 10px; padding: 0 4px; }
}
</style>
</head>
<body>
<div id="app"><div style="padding:40px;text-align:center;color:#4A5773;">⏳ กำลังโหลดข้อมูลระบบรวม (กบรส. & PRI & ส่วนตัว)...</div></div>

<script>
function escapeHTML(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

const DAY = 86400000;
function beDate(beYear, month, day) { return new Date(Date.UTC(beYear - 543, month - 1, day)); }
const RANGE_START_BE = 2569;
const RANGE_END_BE = 2575;
const EPOCH = beDate(RANGE_START_BE, 1, 1);
const EPOCH_T = EPOCH.getTime();

function indexFromDate(d) { return Math.round((d.getTime() - EPOCH_T) / DAY); }
function dateFromIndex(i) { return new Date(EPOCH_T + i * DAY); }
const THAI_MONTHS_SHORT = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const THAI_WEEKDAY_SHORT = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];

function dateToInputStr(d) { return d.toISOString().slice(0, 10); }
function inputStrToDate(str) { if (!str) return null; return new Date(str + 'T00:00:00Z'); }
function formatDateThai(d) {
  if (!d || isNaN(d)) return '';
  const day = String(d.getUTCDate()).padStart(2, '0');
  const month = String(d.getUTCMonth() + 1).padStart(2, '0');
  const year = d.getUTCFullYear() + 543;
  return `${day}/${month}/${year}`;
}

function todayBangkokIndex() {
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok', year: 'numeric', month: '2-digit', day: '2-digit' });
  const parts = fmt.formatToParts(new Date());
  const get = (t) => parseInt(parts.find(p => p.type === t).value, 10);
  const y = get('year'), m = get('month'), d = get('day');
  return indexFromDate(new Date(Date.UTC(y, m - 1, d)));
}

/* ===================== URL ฐานข้อมูลทั้ง 2 ฝั่ง ===================== */
const SCRIPT_URL_WORK = 'https://script.google.com/macros/s/AKfycbzd4llwHPqNUyGCsUUZW7cIS8keeB9h5NinNTTRTf2sLwOpBa9JsiE3boAJlY_XOnwaKw/exec'; // ลิงก์ที่ 1 (กบรส)[cite: 1]
const SCRIPT_URL_EXTRA = 'https://script.google.com/macros/s/AKfycbyP9BKc6r9MnbgNOZAu5bonhx7xuhGxD5Uf-VTmQS7xz8iOHo4NoLI4954Qkil7m5MO/exec'; // ลิงก์ที่ 2 (PRI)[cite: 2]

async function fetchWithTimeout(url, options = {}, timeout = 5000) {
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);
  try {
    const response = await fetch(url, { ...options, signal: controller.signal });
    clearTimeout(id);
    return response;
  } catch (error) {
    clearTimeout(id);
    throw error;
  }
}

let state = null;
let view = { type: 'overview' }; 
let zoom = 'month'; 
let modalOpen = false;
let isSaving = false;
let dragMode = false;

const COLW = { day: 34, week: 6, month: 1.3, year: 0.34 };

const DEFAULT_COLORS = [
  { name: 'ฟ้า', hex: '#22D3EE' }, { name: 'เขียว', hex: '#34D399' },
  { name: 'ชมพู', hex: '#EC4899' }, { name: 'น้ำเงิน', hex: '#3B82F6' },
  { name: 'เหลือง', hex: '#FBBF24' }, { name: 'ม่วง', hex: '#8B5CF6' }
];

function uid(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function mkRow(acts, name = 'แถว 1') { return { id: uid('row'), name, activities: acts }; }
function mkDept(name, rows) { return { id: uid('dept'), name, rows }; }
function seedProject(name, depts, sourceType = 'work') { return { id: uid('proj'), name, color: '#3A2E6E', departments: depts, sourceType }; }

function defaultState() {
  const projA = seedProject('โครงการ กบรส. ตัวอย่าง', [ mkDept('หน่วยงาน กบรส.', [mkRow([], 'แถว 1')]) ], 'work');
  return { 
    projects: [projA],
    colors: JSON.parse(JSON.stringify(DEFAULT_COLORS)),
    viewRange: { start: dateToInputStr(beDate(2569,1,1)), end: dateToInputStr(beDate(2574,12,31)) },
    overviewSettings: { tab1: { name: '📊 ภาพรวมทั้งหมด', color: '' }, tab2: { name: '🛣️ รายละเอียดภาพรวมโครงการ', color: '' } }
  };
}

async function loadState() {
  try {
    let dataWork = { projects: [] };
    try {
      const resWork = await fetchWithTimeout(SCRIPT_URL_WORK, {}, 6000);
      const textWork = await resWork.text();
      dataWork = JSON.parse(textWork);
    } catch(e) { console.warn('โหลดข้อมูล กบรส. ช้าหรือไม่สำเร็จ'); }

    let allProjects = [];
    if (dataWork && dataWork.projects) {
      dataWork.projects.forEach(p => { 
        if (!p.sourceType) p.sourceType = 'work'; 
        allProjects.push(p); 
      });
    }

    if (SCRIPT_URL_EXTRA && SCRIPT_URL_EXTRA.startsWith('http')) {
      try {
        const resExtra = await fetchWithTimeout(SCRIPT_URL_EXTRA, {}, 6000);
        const textExtra = await resExtra.text();
        const dataExtra = JSON.parse(textExtra);
        if (dataExtra && dataExtra.projects) {
          dataExtra.projects.forEach(p => { 
            p.sourceType = 'extra'; 
            allProjects.push(p); 
          });
        }
      } catch(err) { console.warn('โหลดข้อมูล PRI ช้าหรือไม่สำเร็จ'); }
    }

    // โหลดโครงการส่วนตัวที่บันทึกไว้ใน LocalStorage ของเบราว์เซอร์
    try {
      const localPersonal = localStorage.getItem('gantt_personal_projects');
      if (localPersonal) {
        const personalProjects = JSON.parse(localPersonal);
        personalProjects.forEach(p => {
          p.sourceType = 'personal';
          allProjects.push(p);
        });
      }
    } catch(e) { console.warn('โหลดโครงการส่วนตัวไม่สำเร็จ'); }

    let base = dataWork;
    base.projects = allProjects;

    if (!base.colors) base.colors = JSON.parse(JSON.stringify(DEFAULT_COLORS));
    if (!base.viewRange) base.viewRange = { start: dateToInputStr(beDate(2569,1,1)), end: dateToInputStr(beDate(2574,12,31)) };
    if (!base.overviewSettings) base.overviewSettings = { tab1: { name: '📊 ภาพรวมทั้งหมด', color: '' }, tab2: { name: '🛣️ รายละเอียดภาพรวมโครงการ', color: '' } };

    base.projects.forEach(p => {
      if (!p.color) p.color = '#3A2E6E';
      p.departments.forEach(d => d.rows.forEach((r, idx) => { if(!r.name) r.name = `แถว ${idx+1}`; }));
    });
    return base;
  } catch (e) { console.error('Fetch Error:', e); return defaultState(); }
}

async function saveState() {
  if (isSaving) return;
  isSaving = true;
  const statusEl = document.querySelector('.brand-sub');
  if (statusEl) statusEl.innerHTML = 'ระบบรวม · <span style="color:#FBBF24">⏳ กำลังบันทึกข้อมูลแยกส่วนไปยัง Cloud และ Local...</span>';
  
  try {
    let workProjects = state.projects.filter(p => p.sourceType === 'work' || !p.sourceType);
    let extraProjects = state.projects.filter(p => p.sourceType === 'extra');
    let personalProjects = state.projects.filter(p => p.sourceType === 'personal');

    // บันทึกโครงการส่วนตัวลงใน LocalStorage
    try {
      localStorage.setItem('gantt_personal_projects', JSON.stringify(personalProjects));
    } catch(e) { console.error('บันทึกโครงการส่วนตัวลง LocalStorage ไม่สำเร็จ', e); }

    let stateWork = JSON.parse(JSON.stringify(state));
    stateWork.projects = workProjects;
    await fetch(SCRIPT_URL_WORK, { method: 'POST', body: JSON.stringify(stateWork), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });

    if (extraProjects.length > 0 && SCRIPT_URL_EXTRA && SCRIPT_URL_EXTRA.startsWith('http')) {
      let stateExtra = JSON.parse(JSON.stringify(state));
      stateExtra.projects = extraProjects;
      await fetch(SCRIPT_URL_EXTRA, { method: 'POST', body: JSON.stringify(stateExtra), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
    }

    if (statusEl) statusEl.innerHTML = 'ระบบรวม · <span style="color:#34D399">✅ ซิงค์ข้อมูล กบรส., PRI และบันทึกโครงการส่วนตัวสำเร็จ</span>';
  } catch (e) { 
    if (statusEl) statusEl.innerHTML = 'ระบบรวม · <span style="color:#E23D5B">❌ บันทึกไม่สำเร็จบางส่วน</span>';
  }
  isSaving = false;
}

async function persistAndRender() { render(); await saveState(); }

async function init() {
  try {
    state = await loadState();
    if (!state || !state.projects) { state = defaultState(); await saveState(); }
    render();
    setInterval(pollRemote, 10000);
  } catch(e) { document.querySelector('#app').innerHTML = `<div style="padding:40px;text-align:center;color:red;">เกิดข้อผิดพลาด:<br>${e.message}</div>`; }
}

async function pollRemote() {
  if (modalOpen || isSaving || dragMode) return;
  const loaded = await loadState();
  if (loaded && JSON.stringify(loaded) !== JSON.stringify(state)) { state = loaded; render(); }
}

function getRenderBounds() {
  let rStart = indexFromDate(inputStrToDate(state.viewRange.start));
  let rEnd = indexFromDate(inputStrToDate(state.viewRange.end));
  if (rEnd < rStart) rEnd = rStart;
  return { rStart, rEnd, totalDays: rEnd - rStart + 1 };
}

function headerGroupsBounded(rStart, rEnd) {
  const years = [], months = [];
  let prevY = null, prevM = null, yStart = rStart, mStart = rStart;
  for (let i = rStart; i <= rEnd; i++) {
    const d = dateFromIndex(i), y = d.getUTCFullYear() + 543, m = d.getUTCMonth();
    if (i === rStart) { prevY = y; prevM = m; }
    if (y !== prevY || i === rEnd) { years.push({ label: prevY, start: yStart, end: (y !== prevY) ? i - 1 : i }); yStart = i; prevY = y; }
    if (m !== prevM || i === rEnd) { months.push({ label: THAI_MONTHS_SHORT[prevM], start: mStart, end: (m !== prevM) ? i - 1 : i }); mStart = i; prevM = m; }
  }
  return { years, months };
}

function weekSegmentsBounded(rStart, rEnd) {
  const segs = []; let wStart = rStart;
  for (let i = rStart; i <= rEnd; i++) {
    const dow = dateFromIndex(i).getUTCDay();
    if (i > rStart && (dow === 0 || i === rEnd)) {
      const end = (dow === 0 && i !== rEnd) ? i - 1 : i;
      const ds = dateFromIndex(wStart);
      segs.push({ start: wStart, end, label: `${String(ds.getUTCDate()).padStart(2, '0')}/${String(ds.getUTCMonth() + 1).padStart(2, '0')}` });
      wStart = i;
    }
  }
  return segs;
}

function scrollToToday() {

function buildHeader(colw, rStart, rEnd, totalDays, labelText = 'หน่วยงาน / ชื่องาน') {
  const { years, months } = headerGroupsBounded(rStart, rEnd), totalWidth = totalDays * colw;
  const header = document.createElement('div'); header.className = 'gantt-header';

  const yearRow = document.createElement('div'); yearRow.className = 'header-row year-row'; yearRow.innerHTML = `<div class="row-label corner">${labelText}</div>`;
  const yTrack = document.createElement('div'); yTrack.className = 'row-track'; yTrack.style.width = totalWidth + 'px';
  years.forEach(y => { const seg = document.createElement('div'); seg.className = 'hdr-seg year-seg'; seg.style.width = ((y.end - y.start + 1) * colw) + 'px'; seg.textContent = 'พ.ศ. ' + y.label; yTrack.appendChild(seg); });
  yearRow.appendChild(yTrack); header.appendChild(yearRow);

  if (zoom !== 'year') {
    const monthRow = document.createElement('div'); monthRow.className = 'header-row month-row'; monthRow.innerHTML = `<div class="row-label corner"></div>`;
    const mTrack = document.createElement('div'); mTrack.className = 'row-track'; mTrack.style.width = totalWidth + 'px';
    months.forEach(m => { const seg = document.createElement('div'); seg.className = 'hdr-seg month-seg'; seg.style.width = ((m.end - m.start + 1) * colw) + 'px'; seg.textContent = m.label; mTrack.appendChild(seg); });
    monthRow.appendChild(mTrack); header.appendChild(monthRow);
  }

  if (zoom === 'week') {
    const weekRow = document.createElement('div'); weekRow.className = 'header-row week-row'; weekRow.innerHTML = `<div class="row-label corner"></div>`;
    const wTrack = document.createElement('div'); wTrack.className = 'row-track'; wTrack.style.width = totalWidth + 'px';
    weekSegmentsBounded(rStart, rEnd).forEach(seg0 => { const seg = document.createElement('div'); seg.className = 'hdr-seg week-seg'; seg.style.width = ((seg0.end - seg0.start + 1) * colw) + 'px'; seg.textContent = seg0.label; wTrack.appendChild(seg); });
    weekRow.appendChild(wTrack); header.appendChild(weekRow);
  }

  if (zoom === 'day') {
    const dayRow = document.createElement('div'); dayRow.className = 'header-row day-row'; dayRow.innerHTML = `<div class="row-label corner"></div>`;
    const dTrack = document.createElement('div'); dTrack.className = 'row-track'; dTrack.style.width = totalWidth + 'px';
    for (let i = rStart; i <= rEnd; i++) {
      const d = dateFromIndex(i), dow = d.getUTCDay();
      const seg = document.createElement('div'); seg.className = 'hdr-seg day-seg' + (dow === 0 || dow === 6 ? ' weekend' : ''); seg.style.width = colw + 'px';
      seg.innerHTML = `<span class="day-num">${d.getUTCDate()}</span><span class="day-dow">${THAI_WEEKDAY_SHORT[dow]}</span>`; dTrack.appendChild(seg);
    }
    dayRow.appendChild(dTrack); header.appendChild(dayRow);
  }
  return header;
}

function renderLegend(targetProject = null) {
  const wrap = document.createElement('div'); wrap.className = 'legend'; wrap.innerHTML = `<span class="legend-label">สีกิจกรรม:</span>`;
  const usedColorsHex = new Set(); let hasTask = false, hasOverdue = false, hasDueToday = false, todayIdx = todayBangkokIndex();
  const targetList = targetProject ? targetProject.departments : state.projects.flatMap(p => p.departments);
  targetList.forEach(d => d.rows.forEach(r => r.activities.forEach(a => {
    usedColorsHex.add(a.color);
    if(a.type === 'task') { hasTask = true; if(!a.completed && todayIdx > a.end) hasOverdue = true; if(!a.completed && todayIdx === a.end) hasDueToday = true; }
  })));
  const activeColors = state.colors.filter(c => usedColorsHex.has(c.hex));
  if (activeColors.length === 0 && !hasTask) { wrap.innerHTML += `<span style="font-size:12px; color:var(--ink-soft); font-style:italic;">(ยังไม่มีการใช้สีในมุมมองนี้)</span>`; }
  else {
    activeColors.forEach(c => { const chip = document.createElement('span'); chip.className = 'legend-chip'; chip.innerHTML = `<i style="background:${c.hex}"></i>${escapeHTML(c.name)}`; wrap.appendChild(chip); });
    if(hasDueToday) { const chip = document.createElement('span'); chip.className = 'legend-chip'; chip.innerHTML = `<i style="background:#F59E0B"></i>ถึงกำหนด (วันนี้)`; wrap.appendChild(chip); }
    if(hasOverdue) { const chip = document.createElement('span'); chip.className = 'legend-chip'; chip.innerHTML = `<i style="background:#EF4444"></i>เลยกำหนด!`; wrap.appendChild(chip); }
  }
  const editBtn = document.createElement('button'); editBtn.className = 'ghost-btn edit-colors-btn'; editBtn.textContent = '✎ แก้ไขสี'; editBtn.onclick = editColorsModal; wrap.appendChild(editBtn);
  return wrap;
}

function buildSubrow(project, dept, row, colw, totalWidth, rStart, rEnd) {
  const track = document.createElement('div'); track.className = 'subrow'; track.style.width = totalWidth + 'px';
  track.onclick = (e) => { if (e.target === track && project) openActivityModal(project.id, dept.id, row.id, null); };

  row.activities.forEach(act => {
    const actStart = Math.max(rStart, act.start), actEnd = Math.min(rEnd, act.end);
    if (actEnd >= rStart && actStart <= rEnd) {
      const bar = document.createElement('div'); bar.className = 'act-bar' + (dragMode ? ' draggable' : '');
      bar.style.left = ((actStart - rStart) * colw) + 'px'; bar.style.width = Math.max(colw, (actEnd - actStart + 1) * colw - 2) + 'px';
      const todayIdx = todayBangkokIndex(); let displayColor = act.color, prefix = '', statusText = '';
      if (act.type === 'task') {
        if (act.completed) { prefix = '✅ '; statusText = ' (เสร็จสิ้น)'; }
        else {
          if (todayIdx > act.end) { displayColor = '#EF4444'; prefix = '🚨 '; statusText = ' (เลยกำหนด!)'; }
          else if (todayIdx === act.end) { displayColor = '#F59E0B'; prefix = '🔥 '; statusText = ' (ครบกำหนดวันนี้!)'; }
          else { prefix = '📌 '; statusText = ' (รอดำเนินการ)'; }
        }
      }
      bar.style.background = displayColor; bar.textContent = prefix + act.label;
      bar.title = `${prefix}${act.label}${statusText}${act.remark ? '\n📝 หมายเหตุ: ' + act.remark : ''}`;

      if (dragMode) {
        bar.onmousedown = (e) => {
          e.stopPropagation(); e.preventDefault();
          let startX = e.clientX, initialActStart = act.start, duration = act.end - act.start, hasMoved = false;
          function onMouseMove(moveEvent) {
            let dx = moveEvent.clientX - startX, dayShift = Math.round(dx / colw);
            if (dayShift !== 0) {
              hasMoved = true; act.start = initialActStart + dayShift; act.end = act.start + duration;
              let curStart = Math.max(rStart, act.start), curEnd = Math.min(rEnd, act.end);
              bar.style.left = ((curStart - rStart) * colw) + 'px'; bar.style.width = Math.max(colw, (curEnd - curStart + 1) * colw - 2) + 'px';
            }
          }
          function onMouseUp() { window.removeEventListener('mousemove', onMouseMove); window.removeEventListener('mouseup', onMouseUp); if (hasMoved) persistAndRender(); }
          window.addEventListener('mousemove', onMouseMove); window.addEventListener('mouseup', onMouseUp);
        };
      } else { bar.onclick = (e) => { e.stopPropagation(); openActivityModal(project.id, dept.id, row.id, act.id); }; }
      track.appendChild(bar);
    }
  });
  if (project && dept.rows.length > 1) {
    const delRowBtn = document.createElement('button'); delRowBtn.className = 'row-del-btn'; delRowBtn.textContent = '×';
    delRowBtn.onclick = (e) => { e.stopPropagation(); deleteRow(project.id, dept.id, row.id); }; track.appendChild(delRowBtn);
  }
  return track;
}

function renderOverview() {
  const root = document.createElement('div'), toolbar = document.createElement('div'); toolbar.className = 'toolbar';
  toolbar.innerHTML = `<div class="proj-title"><h2>${escapeHTML(state.overviewSettings.tab1.name || 'ภาพรวมทุกโครงการ')}</h2></div>`;
  renderToolbarControls(toolbar); root.appendChild(toolbar); root.appendChild(renderLegend());
  const colw = COLW[zoom], { rStart, rEnd, totalDays } = getRenderBounds(), totalWidth = totalDays * colw;
  const scrollWrap = document.createElement('div'); scrollWrap.className = 'gantt-scroll';
  const inner = document.createElement('div'); inner.className = 'gantt-inner'; inner.appendChild(buildHeader(colw, rStart, rEnd, totalDays, 'ชื่อโครงการ'));
  const body = document.createElement('div'); body.className = 'gantt-body';
  const todayIdx = todayBangkokIndex();

  state.projects.forEach(p => {
    const allActs = p.departments.flatMap(d => d.rows.flatMap(r => r.activities));
    const sorted = [...allActs].sort((a, b) => a.start - b.start), lanes = [], placed = [];
    sorted.forEach(a => {
      let laneIdx = lanes.findIndex(end => end < a.start);
      if (laneIdx === -1) { laneIdx = lanes.length; lanes.push(a.end); } else { lanes[laneIdx] = a.end; }
      placed.push({ act: a, lane: laneIdx });
    });
    const laneCount = Math.max(1, lanes.length);
    const block = document.createElement('div'); block.className = 'dept-block overview-block';
    block.onclick = () => { view = { type: 'project', id: p.id }; render(); };
    const label = document.createElement('div'); label.className = 'row-label';
    label.innerHTML = `<div class="dept-info" style="border-right:none;"><div class="dept-name">${escapeHTML(p.name)}</div><div style="font-size:11px; color:var(--ink-soft);">${p.departments.length} หน่วยงาน · ${allActs.length} งาน</div></div>`;
    block.appendChild(label);

    const rowsWrap = document.createElement('div'); rowsWrap.className = 'dept-rows';
    for (let lane = 0; lane < laneCount; lane++) {
      const track = document.createElement('div'); track.className = 'subrow'; track.style.width = totalWidth + 'px';
      placed.filter(pl => pl.lane === lane).forEach(pl => {
        const act = pl.act, actStart = Math.max(rStart, act.start), actEnd = Math.min(rEnd, act.end);
        if (actEnd >= rStart && actStart <= rEnd) {
          const bar = document.createElement('div'); bar.className = 'act-bar';
          bar.style.left = ((actStart - rStart) * colw) + 'px'; bar.style.width = Math.max(colw, (actEnd - actStart + 1) * colw - 2) + 'px';
          let displayColor = act.color, prefix = '';
          if (act.type === 'task') {
            if (act.completed) prefix = '✅ ';
            else if (todayIdx > act.end) { displayColor = '#EF4444'; prefix = '🚨 '; }
            else if (todayIdx === act.end) { displayColor = '#F59E0B'; prefix = '🔥 '; }
            else prefix = '📌 ';
          }
          bar.style.background = displayColor; bar.textContent = prefix + act.label; track.appendChild(bar);
        }
      });
      rowsWrap.appendChild(track);
    }
    block.appendChild(rowsWrap); body.appendChild(block);
  });
  inner.appendChild(body);
  const overlay = document.createElement('div'); overlay.className = 'gantt-grid-overlay';
  if (todayIdx >= rStart && todayIdx <= rEnd) { const tLine = document.createElement('div'); tLine.className = 'today-line'; tLine.style.left = ((todayIdx - rStart) * colw) + 'px'; overlay.appendChild(tLine); }
  inner.appendChild(overlay); scrollWrap.appendChild(inner); root.appendChild(scrollWrap);
  setTimeout(scrollToToday, 0); return root;
}

function renderLanesOverview() {

  toolbar.innerHTML = `<div class="proj-title"><h2>${escapeHTML(state.overviewSettings.tab2.name || 'รายละเอียดภาพรวมโครงการ')}</h2></div>`;

  const colw = COLW[zoom], { rStart, rEnd, totalDays } = getRenderBounds(), totalWidth = totalDays * colw;
  const scrollWrap = document.createElement('div'); scrollWrap.className = 'gantt-scroll';
  const inner = document.createElement('div'); inner.className = 'gantt-inner'; inner.appendChild(buildHeader(colw, rStart, rEnd, totalDays, 'โครงการ / หน่วยงาน'));
  const body = document.createElement('div'); body.className = 'gantt-body'; const todayIdx = todayBangkokIndex();

  state.projects.forEach(p => {
    const projHeaderBlock = document.createElement('div'); projHeaderBlock.className = 'dept-block'; projHeaderBlock.style.background = 'var(--indigo-soft)';
    const pLabel = document.createElement('div'); pLabel.className = 'row-label corner'; pLabel.style.width = '220px'; pLabel.textContent = `📁 ${p.name}`;
    projHeaderBlock.appendChild(pLabel);
    const pTrackWrap = document.createElement('div'); pTrackWrap.className = 'subrow'; pTrackWrap.style.width = totalWidth + 'px';
    projHeaderBlock.appendChild(pTrackWrap); body.appendChild(projHeaderBlock);

    p.departments.forEach(dept => {
      const deptBlock = document.createElement('div'); deptBlock.className = 'dept-block';
      const labelCol = document.createElement('div'); labelCol.className = 'row-label';
      const deptInfo = document.createElement('div'); deptInfo.className = 'dept-info'; deptInfo.innerHTML = `<div class="dept-name" style="padding-left:10px;">↳ ${escapeHTML(dept.name)}</div>`;
      const rowNamesCol = document.createElement('div'); rowNamesCol.className = 'dept-row-names';
      dept.rows.forEach(row => { const rCell = document.createElement('div'); rCell.className = 'row-name-cell'; rCell.innerHTML = `<span class="r-name-text">${escapeHTML(row.name)}</span>`; rowNamesCol.appendChild(rCell); });
      labelCol.appendChild(deptInfo); labelCol.appendChild(rowNamesCol); deptBlock.appendChild(labelCol);

      const rowsWrap = document.createElement('div'); rowsWrap.className = 'dept-rows';
      dept.rows.forEach(row => {
        const track = document.createElement('div'); track.className = 'subrow'; track.style.width = totalWidth + 'px';
        row.activities.forEach(act => {
          const actStart = Math.max(rStart, act.start), actEnd = Math.min(rEnd, act.end);
          if (actEnd >= rStart && actStart <= rEnd) {
            const bar = document.createElement('div'); bar.className = 'act-bar';
            bar.style.left = ((actStart - rStart) * colw) + 'px'; bar.style.width = Math.max(colw, (actEnd - actStart + 1) * colw - 2) + 'px';
            let displayColor = act.color, prefix = '';
            if (act.type === 'task') {
              if (act.completed) prefix = '✅ ';
              else if (todayIdx > act.end) { displayColor = '#EF4444'; prefix = '🚨 '; }
              else if (todayIdx === act.end) { displayColor = '#F59E0B'; prefix = '🔥 '; }
              else prefix = '📌 ';
            }
            bar.style.background = displayColor; bar.textContent = prefix + act.label; track.appendChild(bar);
          }
        });
        rowsWrap.appendChild(track);
      });
      deptBlock.appendChild(rowsWrap); body.appendChild(deptBlock);
    });
  });
  inner.appendChild(body);
  const overlay = document.createElement('div'); overlay.className = 'gantt-grid-overlay';
  if (todayIdx >= rStart && todayIdx <= rEnd) { const tLine = document.createElement('div'); tLine.className = 'today-line'; tLine.style.left = ((todayIdx - rStart) * colw) + 'px'; overlay.appendChild(tLine); }
  inner.appendChild(overlay); scrollWrap.appendChild(inner); root.appendChild(scrollWrap);
  setTimeout(scrollToToday, 0); return root;
}

function openActivityModal(projectId, deptId, rowId, actId) {
  const p = state.projects.find(x => x.id === projectId), d = p.departments.find(x => x.id === deptId), r = d.rows.find(x => x.id === rowId);
  const existing = actId ? r.activities.find(a => a.id === actId) : null;
  modalOpen = true; const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
  const modal = document.createElement('div'); modal.className = 'modal';
  const todayIdx = todayBangkokIndex(), startD = existing ? dateFromIndex(existing.start) : dateFromIndex(todayIdx), endD = existing ? dateFromIndex(existing.end) : dateFromIndex(todayIdx);

  modal.innerHTML = `
    <h3>${existing ? 'แก้ไขกิจกรรม' : 'เพิ่มกิจกรรม'}</h3>
    <label class="field-label">ชื่อกิจกรรม</label>
    <input type="text" id="actLabel" class="text-input" value="${existing ? escapeHTML(existing.label) : ''}" placeholder="เช่น ประชุม, รายงาน">
    <label class="field-label">ประเภทกิจกรรม</label>
    <select id="actType" class="text-input" style="margin-bottom: 10px;">
      <option value="note" ${!existing || existing.type !== 'task' ? 'selected' : ''}>📝 บันทึกข้อความ/กิจกรรมทั่วไป</option>
      <option value="task" ${existing && existing.type === 'task' ? 'selected' : ''}>🎯 กำหนดการที่ต้องทำให้เสร็จ</option>
    </select>
    <div id="taskStatusWrap" style="display: ${existing && existing.type === 'task' ? 'flex' : 'none'}; align-items: center; gap: 8px; margin-bottom: 10px; background: var(--indigo-soft); padding: 10px; border-radius: 8px;">
      <input type="checkbox" id="actCompleted" ${existing && existing.completed ? 'checked' : ''} style="width: 18px; height: 18px; cursor: pointer;">
      <label for="actCompleted" style="font-weight: 600; color: var(--indigo-deep); cursor: pointer;">ทำกิจกรรมนี้เสร็จเรียบร้อยแล้ว ✅</label>
    </div>
    <label class="field-label">หมายเหตุ</label>
    <textarea id="actRemark" class="text-input" placeholder="รายละเอียดเพิ่มเติม...">${existing && existing.remark ? escapeHTML(existing.remark) : ''}</textarea>
    <label class="field-label">วันที่เริ่มต้น</label>
    <div style="display:flex; gap:6px; align-items:center;"><input type="date" id="actStart" class="text-input" value="${dateToInputStr(startD)}" style="flex:1;"><span id="txtStartThai" style="font-size:12px; font-weight:600; color:var(--indigo); min-width:85px; text-align:right;">${formatDateThai(startD)}</span></div>
    <label class="field-label">วันที่สิ้นสุด</label>
    <div style="display:flex; gap:6px; align-items:center;"><input type="date" id="actEnd" class="text-input" value="${dateToInputStr(endD)}" style="flex:1;"><span id="txtEndThai" style="font-size:12px; font-weight:600; color:var(--indigo); min-width:85px; text-align:right;">${formatDateThai(endD)}</span></div>
    <label class="field-label" style="margin-top:10px;">สีกิจกรรม</label>
    <div class="color-picker" id="colorPicker"></div>
    <div class="modal-actions" id="modalActions"></div>
  `;
  overlay.appendChild(modal); document.body.appendChild(overlay);

  modal.querySelector('#actType').addEventListener('change', (e) => { modal.querySelector('#taskStatusWrap').style.display = e.target.value === 'task' ? 'flex' : 'none'; });
  modal.querySelector('#actStart').oninput = (e) => { modal.querySelector('#txtStartThai').textContent = formatDateThai(inputStrToDate(e.target.value)); };
  modal.querySelector('#actEnd').oninput = (e) => { modal.querySelector('#txtEndThai').textContent = formatDateThai(inputStrToDate(e.target.value)); };

  let chosenColor = existing ? existing.color : state.colors[0].hex;
  const picker = modal.querySelector('#colorPicker');
  state.colors.forEach(c => {
    const sw = document.createElement('div'); sw.className = 'color-swatch' + (c.hex === chosenColor ? ' selected' : '');
    sw.style.background = c.hex; sw.onclick = () => { chosenColor = c.hex; [...picker.children].forEach(ch => ch.classList.remove('selected')); sw.classList.add('selected'); };
    picker.appendChild(sw);
  });

  const actions = modal.querySelector('#modalActions');
  const saveBtn = document.createElement('button'); saveBtn.className = 'primary-btn'; saveBtn.textContent = 'บันทึก';
  saveBtn.onclick = async () => {
    const label = modal.querySelector('#actLabel').value.trim() || 'กิจกรรม', type = modal.querySelector('#actType').value, completed = modal.querySelector('#actCompleted').checked, remark = modal.querySelector('#actRemark').value.trim();
    let sIdx = indexFromDate(inputStrToDate(modal.querySelector('#actStart').value)), eIdx = indexFromDate(inputStrToDate(modal.querySelector('#actEnd').value));
    if (eIdx < sIdx) eIdx = sIdx;
    if (existing) { existing.label = label; existing.color = chosenColor; existing.start = sIdx; existing.end = eIdx; existing.type = type; existing.completed = completed; existing.remark = remark; }
    else { r.activities.push({ id: uid('act'), label, color: chosenColor, start: sIdx, end: eIdx, type, completed, remark }); }
    closeModal(overlay); await persistAndRender();
  };
  actions.appendChild(saveBtn);

  if (existing) {
    const delBtn = document.createElement('button'); delBtn.className = 'danger-btn'; delBtn.textContent = 'ลบกิจกรรม';
    delBtn.onclick = async () => { r.activities = r.activities.filter(a => a.id !== existing.id); closeModal(overlay); await persistAndRender(); };
    actions.appendChild(delBtn);
  }
  const cancelBtn = document.createElement('button'); cancelBtn.className = 'ghost-btn'; cancelBtn.textContent = 'ยกเลิก'; cancelBtn.onclick = () => closeModal(overlay); actions.appendChild(cancelBtn);
}

function openTextModal(title, fieldLabel, initial, onSave) {
  modalOpen = true; const overlay = document.createElement('div'); overlay.className = 'modal-overlay'; const modal = document.createElement('div'); modal.className = 'modal';
  modal.innerHTML = `<h3>${escapeHTML(title)}</h3><label class="field-label">${escapeHTML(fieldLabel)}</label><input type="text" id="txtInput" class="text-input" value="${escapeHTML(initial)}"><div class="modal-actions" id="modalActions"></div>`;
  overlay.appendChild(modal); document.body.appendChild(overlay); const input = modal.querySelector('#txtInput'); setTimeout(() => input.focus(), 0);
  const actions = modal.querySelector('#modalActions'), saveBtn = document.createElement('button'); saveBtn.className = 'primary-btn'; saveBtn.textContent = 'บันทึก';
  const doSave = () => { closeModal(overlay); onSave(input.value.trim()); }; saveBtn.onclick = doSave; input.onkeydown = (e) => { if (e.key === 'Enter') doSave(); }; actions.appendChild(saveBtn);
  const cancelBtn = document.createElement('button'); cancelBtn.className = 'ghost-btn'; cancelBtn.textContent = 'ยกเลิก'; cancelBtn.onclick = () => closeModal(overlay); actions.appendChild(cancelBtn);
}
function openConfirmModal(title, desc, onConfirm) {

  modal.innerHTML = `<h3>${escapeHTML(title)}</h3><p class="modal-desc">${escapeHTML(desc)}</p><div class="modal-actions" id="modalActions"></div>`;
  overlay.appendChild(modal); document.body.appendChild(overlay);
  const actions = modal.querySelector('#modalActions'), confirmBtn = document.createElement('button'); confirmBtn.className = 'danger-btn'; confirmBtn.textContent = 'ยืนยัน';
  confirmBtn.onclick = async () => { closeModal(overlay); await onConfirm(); }; actions.appendChild(confirmBtn);
  const cancelBtn = document.createElement('button'); cancelBtn.className = 'ghost-btn'; cancelBtn.textContent = 'ยกเลิก'; cancelBtn.onclick = () => closeModal(overlay); actions.appendChild(cancelBtn);
}
function closeModal(overlay) { modalOpen = false; overlay.remove(); }
