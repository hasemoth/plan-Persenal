<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผนการดำเนินงานรวม — กบรส. & PRI & ส่วนตัว (ระบบ Cloud)</title>
<!-- นำเข้าไลบรารีสำหรับหน้าต่างแก้ไขข้อความแบบ Word -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.2/tinymce.min.js"></script>
<style>
/* --- THEME & CSS VARIABLES --- */
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');
:root {
  --ink: #16233B; --ink-soft: #4A5773; --bg: #F3F5F9; --surface: #FFFFFF;
  --indigo: #3A2E6E; --indigo-deep: #241C4D; --indigo-soft: #EDEAFB;
  --line: #E1E4EC; --line-soft: #EEF0F5; --cyan: #22D3EE; --danger: #E23D5B;
  --danger-soft: #FDEAEE; --radius: 10px; --sticky-bg: #FAFBFD;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: 'Sarabun', 'Noto Sans Thai', sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; }
#app { display: flex; flex-direction: column; min-height: 100vh; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 22px; background: linear-gradient(135deg, var(--indigo-deep), var(--indigo)); color: #fff; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 42px; height: 42px; border-radius: 10px; background: var(--cyan); color: var(--indigo-deep); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; line-height: 1.1; letter-spacing: 0.5px; }
.brand-title { font-weight: 700; font-size: 18px; line-height: 1.2; }
.brand-sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }

/* --- Two-Tier Navigation --- */
.nav-container { background: var(--surface); border-bottom: 1px solid var(--line); }
.main-cat-bar { display: flex; align-items: center; gap: 8px; padding: 10px 18px 6px; border-bottom: 1px dashed var(--line-soft); }
.main-cat-btn { font-family: inherit; font-size: 13.5px; font-weight: 600; padding: 7px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink-soft); cursor: pointer; transition: all .15s ease; display: flex; align-items: center; gap: 6px; }
.main-cat-btn:hover { border-color: var(--indigo); color: var(--indigo); }
.main-cat-btn.active { background: var(--indigo-deep); border-color: var(--indigo-deep); color: #fff; }

.sub-tabs-bar { display: flex; align-items: center; gap: 6px; padding: 6px 18px 10px; overflow-x: auto; background: #FAFAFD; }
.tab { position: relative; border: 1px solid var(--line); background: var(--bg); color: var(--ink-soft); padding: 8px 32px 8px 14px; border-radius: 999px; font-family: inherit; font-size: 13.5px; cursor: pointer; white-space: nowrap; transition: all .15s ease; display: flex; align-items: center; gap: 6px; }
.tab:hover { border-color: var(--indigo); color: var(--indigo); }
.tab.active { background: var(--indigo); border-color: var(--indigo); color: #fff; font-weight: 600; }
.tab-add { padding: 8px 16px; border-style: dashed; }
.tab-del { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 15px; line-height: 1; padding: 2px 5px; border-radius: 50%; opacity: 0.6; }
.tab-del:hover { opacity: 1; background: rgba(0,0,0,0.15); }
.tab-color-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 13px; line-height: 1; padding: 2px 5px; border-radius: 50%; opacity: 0.6; cursor: pointer; }
.tab-color-btn:hover { opacity: 1; background: rgba(0,0,0,0.15); }

.badge-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; line-height: 1; margin-left: 4px; }
.badge-tag.work { background: #E0F2FE; color: #0369A1 !important; border: 1px solid #BAE6FD; }
.badge-tag.extra { background: #FEF3C7; color: #D97706 !important; border: 1px solid #FDE68A; }
.badge-tag.personal { background: #F3E8FF; color: #7E22CE !important; border: 1px solid #E9D5FF; }

.content { padding: 18px 22px 40px; flex: 1; }
.toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 12px; }
.proj-title { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.proj-title h2 { margin: 0; font-size: 19px; font-weight: 700; color: var(--indigo-deep); }
.ghost-btn, .primary-btn, .danger-btn, .icon-btn, .zoom-btn { font-family: inherit; border-radius: 8px; cursor: pointer; font-size: 13px; border: 1px solid var(--line); background: #fff; padding: 7px 12px; color: var(--ink-soft); transition: all .12s ease; }
.ghost-btn:hover { border-color: var(--indigo); color: var(--indigo); }
.primary-btn { background: var(--indigo); border-color: var(--indigo); color: #fff; font-weight: 600; }
.primary-btn:hover { background: var(--indigo-deep); }
.danger-btn { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); font-weight: 600; }
.danger-btn:hover { background: var(--danger); color: #fff; }
.zoom-controls, .filter-controls, .mode-controls { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); padding: 4px; border-radius: 999px; }
.filter-controls, .mode-controls { padding: 4px 10px; font-size: 12.5px; color: var(--ink-soft); }
.zoom-label { font-size: 12.5px; color: var(--ink-soft); padding: 0 6px 0 8px; }
.zoom-btn { border-radius: 999px; border-color: transparent; padding: 6px 14px; }
.zoom-btn.active { background: var(--indigo-soft); color: var(--indigo); font-weight: 600; }
.today-btn { border-color: var(--line); }
.filter-controls input[type="date"] { border: none; outline: none; background: transparent; font-family: inherit; font-size: 12.5px; color: var(--ink); cursor: pointer; }
.legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
.legend-label { font-size: 12.5px; color: var(--ink-soft); }
.legend-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-soft); }
.legend-chip i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.edit-colors-btn { font-size: 11px; padding: 4px 8px; margin-left: 8px; }

/* Grid Background System */
.gantt-scroll { overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); max-height: 72vh; position: relative; }
.gantt-inner { position: relative; min-width: max-content; }
.gantt-header { position: sticky; top: 0; z-index: 20; background: var(--sticky-bg); }
.gantt-grid-bg { position: absolute; top: 0; bottom: 0; left: 220px; pointer-events: none; z-index: 0; overflow: hidden; }
.grid-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-soft); }

.header-row { display: flex; }
.row-label { position: sticky; left: 0; z-index: 10; width: 220px; min-width: 220px; max-width: 220px; background: #FAFBFD; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line-soft); display: flex; align-items: stretch; padding: 0; font-size: 13px; }
.corner { z-index: 30; font-weight: 700; color: var(--indigo-deep); background: var(--indigo-soft); border-bottom: 1px solid var(--line); padding: 6px 10px; display: flex; align-items: center; }
.dept-info { flex: 1; padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; gap: 4px; border-right: 1px solid var(--line-soft); min-width: 0; }
.dept-name { font-weight: 600; color: var(--ink); line-height: 1.2; word-break: break-word; }
.dept-ctrls { display: flex; gap: 4px; flex-wrap: wrap; }
.dept-ctrls .icon-btn { padding: 3px 7px; font-size: 11px; }
.dept-row-names { width: 76px; flex-shrink: 0; display: flex; flex-direction: column; background: #FAFAFD; }
.row-name-cell { height: 32px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; justify-content: space-between; padding: 0 6px; font-size: 11px; color: var(--ink-soft); cursor: pointer; transition: all 0.15s ease; }
.row-name-cell:hover { background: var(--indigo-soft); color: var(--indigo); font-weight: 600; }
.row-name-cell:last-child { border-bottom: none; }
.r-name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.row-track { position: relative; display: flex; }
.hdr-seg { border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--ink-soft); flex-shrink: 0; overflow: hidden; white-space: nowrap; }
.year-seg { background: var(--indigo-soft); color: var(--indigo-deep); font-weight: 700; height: 30px; }
.month-seg { background: #fff; height: 26px; }
.week-seg { background: #fbfbfd; height: 22px; font-size: 10.5px; color: #98A2B8; }
.day-seg { height: 30px; flex-direction: column; gap: 0; background: #fff; font-size: 10px; color: #98A2B8; line-height: 1.1; }
.day-seg.weekend { background: #FBF6EE; color: #C08A2E; }
.day-seg .day-num { font-weight: 700; font-size: 11.5px; color: var(--ink); }
.day-seg.weekend .day-num { color: #C08A2E; }
.gantt-body { position: relative; min-width: max-content; }
.dept-block { display: flex; border-bottom: 2px solid var(--line); min-width: max-content; width: 100%; align-items: stretch; }
.dept-rows { display: flex; flex-direction: column; flex: 1; }

.subrow { position: relative; height: 32px; box-sizing: border-box; border-bottom: 1px solid var(--line-soft); cursor: pointer; z-index: 1; }
.subrow:last-child { border-bottom: none; }
.subrow:hover { background-color: rgba(237, 234, 251, 0.3); }

/* Activity Bar Base Styles */
.act-bar { position: absolute; top: 4px; height: 24px; border-radius: 6px; color: #14213A; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; box-shadow: 0 1px 2px rgba(20,33,58,0.25); cursor: pointer; z-index: 2; user-select: none; transition: transform 0.1s ease, filter 0.1s ease; overflow: hidden; }
.act-bar.draggable { cursor: grab; touch-action: none; }
.act-bar.draggable:active { cursor: grabbing; }
.act-bar:hover { filter: brightness(1.04); box-shadow: 0 2px 6px rgba(20,33,58,0.35); z-index: 3; }

.row-del-btn { position: absolute; right: 4px; top: 4px; width: 18px; height: 18px; border-radius: 50%; border: none; background: var(--line); color: var(--ink-soft); font-size: 12px; line-height: 1; cursor: pointer; z-index: 4; opacity: 0.5; }
.row-del-btn:hover { opacity: 1; background: var(--danger); color: #fff; }
.gantt-grid-overlay { position: absolute; top: 0; bottom: 0; right: 0; left: 220px; pointer-events: none; z-index: 15; }
.today-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); }
.today-line::before { content: 'วันนี้'; position: absolute; top: 2px; left: 4px; font-size: 11px; color: var(--danger); font-weight: 700; background: rgba(255,255,255,0.8); padding: 0 4px; border-radius: 4px; }
.empty-hint { padding: 30px; text-align: center; color: var(--ink-soft); font-size: 13.5px; }

/* Modal & Custom Date Picker */
.modal-overlay { position: fixed; inset: 0; background: rgba(20,25,45,0.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: #fff; border-radius: 14px; padding: 22px 24px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.modal h3 { margin: 0 0 14px; color: var(--indigo-deep); font-size: 17px; }
.modal-desc { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 16px; }
.field-label { display: block; font-size: 12.5px; font-weight:600; color: var(--ink-soft); margin: 12px 0 5px; }
.text-input { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); font-family: inherit; font-size: 13.5px; }
textarea.text-input { resize: vertical; min-height: 60px; }
.text-input:focus { outline: 2px solid var(--cyan); border-color: var(--cyan); }

.date-display { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: #fff; display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; color: var(--ink); }
.date-wrapper:focus-within .date-display { border-color: var(--cyan); outline: 2px solid var(--cyan); }

.color-picker { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.color-swatch { width: 26px; height: 26px; border-radius: 7px; cursor: pointer; border: 2px solid transparent; }
.color-swatch.selected { border-color: var(--indigo-deep); box-shadow: 0 0 0 2px #fff inset; }
.modal-actions { display: flex; gap: 8px; margin-top: 24px; justify-content: flex-end; }
@media (max-width: 720px) {
  .topbar { flex-direction: column; align-items: flex-start; gap: 10px; }
  .row-label { width: 160px; min-width: 160px; max-width: 160px; }
  .gantt-grid-overlay, .gantt-grid-bg { left: 160px; }
  .dept-row-names { width: 56px; }
  .row-name-cell { font-size: 10px; padding: 0 4px; }
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">รวม</div>
      <div class="brand-text">
        <div class="brand-title">แผนการดำเนินงานรวม (Unified Cloud)</div>
        <div class="brand-sub">✅ อัปเดตข้อมูลล่าสุด</div>
      </div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="ghost-btn" style="color:white; border-color:rgba(255,255,255,0.3);" onclick="exportBackup()">📥 สำรองข้อมูล (JSON)</button>
      <button class="ghost-btn" style="color:white; border-color:rgba(255,255,255,0.3);" onclick="document.getElementById('importFile').click()">📤 กู้คืนข้อมูล</button>
      <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importBackup(event)">
    </div>
  </div>
  <div style="padding:40px;text-align:center;color:#4A5773;">⏳ กำลังโหลดข้อมูลระบบรวม...</div>
</div>

<script>
// ==========================================
// --- CORE ENGINE & STATE MANAGEMENT ---
// ==========================================
function escapeHTML(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

const DAY = 86400000;
function beDate(beYear, month, day) { return new Date(Date.UTC(beYear - 543, month - 1, day)); }
const RANGE_START_BE = 2569;
const RANGE_END_BE = 2575;
const EPOCH = beDate(RANGE_START_BE, 1, 1);
const EPOCH_T = EPOCH.getTime();

function indexFromDate(d) { return Math.round((d.getTime() - EPOCH_T) / DAY); }
function dateFromIndex(i) { return new Date(EPOCH_T + i * DAY); }
const THAI_MONTHS_SHORT = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const THAI_WEEKDAY_SHORT = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];

function dateToInputStr(d) { return d.toISOString().slice(0, 10); }
function inputStrToDate(str) { if (!str) return null; return new Date(str + 'T00:00:00Z'); }
function formatDisplayDate(d) {
    if (!d || isNaN(d)) return '';
    return `${String(d.getUTCDate()).padStart(2, '0')}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${d.getUTCFullYear()}`;
}
function formatDateThai(d) {
  if (!d || isNaN(d)) return '';
  return `${String(d.getUTCDate()).padStart(2, '0')}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${d.getUTCFullYear() + 543}`;
}

function todayBangkokIndex() {
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok', year: 'numeric', month: '2-digit', day: '2-digit' });
  const parts = fmt.formatToParts(new Date());
  const get = (t) => parseInt(parts.find(p => p.type === t).value, 10);
  return indexFromDate(new Date(Date.UTC(get('year'), get('month') - 1, get('day'))));
}

// CONFIGURATION & SECURE APPS SCRIPT URLS
const API_TOKEN = "MY_SECURE_TOKEN_2026_!@#"; 
const URLS = {
    work: 'https://script.google.com/macros/s/AKfycbzd4llwHPqNUyGCsUUZW7cIS8keeB9h5NinNTTRTf2sLwOpBa9JsiE3boAJlY_XOnwaKw/exec',
    extra: 'https://script.google.com/macros/s/AKfycbyP9BKc6r9MnbgNOZAu5bonhx7xuhGxD5Uf-VTmQS7xz8iOHo4NoLI4954Qkil7m5MO/exec'
};

const urlParams = new URLSearchParams(window.location.search);
const APP_MODE = urlParams.get('mode') || 'all'; 

let state = null, view = { type: 'overview' }, activeMainCat = APP_MODE === 'all' ? 'all' : APP_MODE, zoom = 'month', modalOpen = false, isSaving = false, dragMode = false;
let userScale = 1.0; 
let lastScrollCenterIdx = null; 

const COLW = { day: 34, week: 6, month: 1.3, year: 0.34 };
const DEFAULT_COLORS = [
  { name: 'ฟ้า', hex: '#22D3EE' }, { name: 'เขียว', hex: '#34D399' },
  { name: 'ชมพู', hex: '#EC4899' }, { name: 'น้ำเงิน', hex: '#3B82F6' },
  { name: 'เหลือง', hex: '#FBBF24' }, { name: 'ม่วง', hex: '#8B5CF6' }
];

function uid(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function mkRow(acts, name = 'แถว 1') { return { id: uid('row'), name, activities: acts }; }
function mkDept(name, rows) { return { id: uid('dept'), name, rows }; }
function seedProject(name, depts, sourceType = 'work') { return { id: uid('proj'), name, color: '#3A2E6E', departments: depts, sourceType }; }
function defaultState() {
  return { 
    lastModified: Date.now(),
    projects: [seedProject('โครงการ กบรส. ตัวอย่าง', [ mkDept('หน่วยงาน กบรส.', [mkRow([], 'แถว 1')]) ], 'work')],
    colors: JSON.parse(JSON.stringify(DEFAULT_COLORS)),
    viewRange: { start: dateToInputStr(beDate(2569,1,1)), end: dateToInputStr(beDate(2574,12,31)) },
    overviewSettings: { tab1: { name: '📊 ภาพรวมทั้งหมด', color: '' }, tab2: { name: '🛣️ รายละเอียดภาพรวมโครงการ', color: '' } }
  };
}

async function secureFetch(url) {
  const response = await fetch(`${url}?token=${API_TOKEN}`);
  const data = await response.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function securePost(url, dataPayload, force = false) {
  const payload = { token: API_TOKEN, force: force, data: dataPayload };
  const response = await fetch(url, {
      method: 'POST',
      body: JSON.stringify(payload),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
  });
  return await response.json();
}

async function loadUnifiedState() {
  try {
    let allProjects = [];
    let latestMod = 0;

    if (APP_MODE === 'work' || APP_MODE === 'all') {
        try {
            const dataWork = await secureFetch(URLS.work);
            if (dataWork && dataWork.projects) {
                dataWork.projects.forEach(p => { p.sourceType = 'work'; allProjects.push(p); });
                if (dataWork.lastModified > latestMod) latestMod = dataWork.lastModified;
            }
        } catch(e) {}
    }

    if (APP_MODE === 'extra' || APP_MODE === 'all') {
        try {
            const dataExtra = await secureFetch(URLS.extra);
            if (dataExtra && dataExtra.projects) {
                dataExtra.projects.forEach(p => { p.sourceType = 'extra'; allProjects.push(p); });
                if (dataExtra.lastModified > latestMod) latestMod = dataExtra.lastModified;
            }
        } catch(err) {}
    }

    try {
      const localPersonal = localStorage.getItem('gantt_personal_projects');
      if (localPersonal) JSON.parse(localPersonal).forEach(p => { p.sourceType = 'personal'; allProjects.push(p); });
    } catch(e) {}

    let base = {
        lastModified: latestMod || Date.now(),
        projects: allProjects,
        colors: JSON.parse(JSON.stringify(DEFAULT_COLORS)),
        viewRange: { start: dateToInputStr(beDate(2569,1,1)), end: dateToInputStr(beDate(2574,12,31)) },
        overviewSettings: { tab1: { name: '📊 ภาพรวมทั้งหมด', color: '' }, tab2: { name: '🛣️ รายละเอียดภาพรวมโครงการ', color: '' } }
    };

    base.projects.forEach(p => {
      if (!p.color) p.color = '#3A2E6E';
      p.departments.forEach(d => d.rows.forEach((r, idx) => { if(!r.name) r.name = `แถว ${idx+1}`; }));
    });
    return base;
  } catch (e) { return defaultState(); }
}

async function saveState() {
  if (isSaving) return; isSaving = true;
  const statusEl = document.querySelector('.brand-sub');
  if (statusEl) statusEl.innerHTML = 'ระบบรวม · <span style="color:#FBBF24">⏳ กำลังบันทึกข้อมูล...</span>';
  try {
    let workProjects = state.projects.filter(p => p.sourceType === 'work' || !p.sourceType);
    let extraProjects = state.projects.filter(p => p.sourceType === 'extra');
    let personalProjects = state.projects.filter(p => p.sourceType === 'personal');

    localStorage.setItem('gantt_personal_projects', JSON.stringify(personalProjects));
    state.lastModified = Date.now();

    if (APP_MODE === 'work' || APP_MODE === 'all') {
        let stateWork = JSON.parse(JSON.stringify(state)); stateWork.projects = workProjects;
        const resWork = await securePost(URLS.work, stateWork, false);
        if (resWork.error === "Conflict") {
            const override = confirm("⚠️ มีการแก้ไขข้อมูลบนเซิร์ฟเวอร์ กบรส. ก่อนหน้าคุณ!\n\nกด OK เพื่อดึงข้อมูลล่าสุด\nกด Cancel เพื่อบังคับบันทึกทับ");
            if (override) { state = await loadUnifiedState(); render(); isSaving = false; return; }
            else { await securePost(URLS.work, stateWork, true); }
        } else if (resWork.error) {
            throw new Error("กบรส.: " + resWork.error);
        }
    }
 
    if ((APP_MODE === 'extra' || APP_MODE === 'all') && extraProjects.length > 0) {
      let stateExtra = JSON.parse(JSON.stringify(state)); stateExtra.projects = extraProjects;
      const resExtra = await securePost(URLS.extra, stateExtra, false);
      if (resExtra.error === "Conflict") {
          const override = confirm("⚠️ มีการแก้ไขข้อมูลบนเซิร์ฟเวอร์ PRI ก่อนหน้าคุณ!\n\nกด OK เพื่อดึงข้อมูลล่าสุด\nกด Cancel เพื่อบังคับบันทึกทับ");
          if (override) { state = await loadUnifiedState(); render(); isSaving = false; return; }
          else { await securePost(URLS.extra, stateExtra, true); }
      } else if (resExtra.error) {
          throw new Error("PRI: " + resExtra.error);
      }
    }

    if (statusEl) statusEl.innerHTML = 'ระบบรวม · <span style="color:#34D399">✅ ซิงค์ข้อมูลเรียบร้อยแล้ว</span>';
  } catch (e) { if (statusEl) statusEl.innerHTML = 'ระบบรวม · <span style="color:#E23D5B">❌ บันทึกไม่สำเร็จ</span>'; }
  isSaving = false;
}

async function persistAndRender() { render(); await saveState(); }

async function init() {
  try {
    state = await loadUnifiedState(); if (!state || !state.projects) { state = defaultState(); await saveState(); }
    render(); 
    // Adaptive Polling
    setInterval(async () => {
      if (document.visibilityState !== 'visible') return;
      if (modalOpen || isSaving || dragMode) return;
      const loaded = await loadUnifiedState(); 
      if (loaded && loaded.lastModified !== state.lastModified) { 
          state = loaded; 
          render(); 
      }
    }, 12000);
  } catch(e) {}
}

function exportBackup() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));

    downloadAnchorNode.setAttribute("download", `gantt_backup_${new Date().toISOString().split('T')[0]}.json`);
    document.body.appendChild(downloadAnchorNode);
    downloadAnchorNode.click();
    downloadAnchorNode.remove();
}

function importBackup(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const importedState = JSON.parse(e.target.result);
            if (importedState && importedState.projects) {
                state = importedState;
                await saveState();
                render();
                alert("กู้คืนข้อมูลสำเร็จเรียบร้อยแล้ว!");
            }
        } catch (error) {
            alert("ไฟล์ Backup ไม่ถูกต้อง หรือข้อมูลเสียหาย");
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

function getColWidth(zoom, totalDays) {
  const labelW = window.innerWidth <= 720 ? 160 : 220;
  const containerWidth = window.innerWidth - 44 - 2 - labelW;
  const minColw = COLW[zoom];
  const requiredWidth = totalDays * minColw;
  let baseWidth = minColw;
  if (requiredWidth < containerWidth && requiredWidth > 0) baseWidth = containerWidth / totalDays;
  return baseWidth * userScale;
}

let resizeTimer; window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (!modalOpen && !dragMode) render(); }, 200); });

function getRenderBounds() {
  let rStart = indexFromDate(inputStrToDate(state.viewRange.start));
  let rEnd = indexFromDate(inputStrToDate(state.viewRange.end));
  if (rEnd < rStart) rEnd = rStart; return { rStart, rEnd, totalDays: rEnd - rStart + 1 };
}
function headerGroupsBounded(rStart, rEnd) {
  const years = [], months = []; let prevY = null, prevM = null, yStart = rStart, mStart = rStart;
  for (let i = rStart; i <= rEnd; i++) {
    const d = dateFromIndex(i), y = d.getUTCFullYear() + 543, m = d.getUTCMonth();
    if (i === rStart) { prevY = y; prevM = m; }
    if (y !== prevY || i === rEnd) { years.push({ label: prevY, start: yStart, end: (y !== prevY) ? i - 1 : i }); yStart = i; prevY = y; }
    if (m !== prevM || i === rEnd) { months.push({ label: THAI_MONTHS_SHORT[prevM], start: mStart, end: (m !== prevM) ? i - 1 : i }); mStart = i; prevM = m; }
  }
  return { years, months };
}
function weekSegmentsBounded(rStart, rEnd) {
  const segs = []; let wStart = rStart;
  for (let i = rStart; i <= rEnd; i++) {
    const dow = dateFromIndex(i).getUTCDay();
    if (i > rStart && (dow === 0 || i === rEnd)) {
      const end = (dow === 0 && i !== rEnd) ? i - 1 : i; const ds = dateFromIndex(wStart);
      segs.push({ start: wStart, end, label: `${String(ds.getUTCDate()).padStart(2, '0')}/${String(ds.getUTCMonth() + 1).padStart(2, '0')}` }); wStart = i;
    }
  }
  return segs;
}

function reRenderWithScroll() {
    const el = document.querySelector('.gantt-scroll');
    if (el) {
        const { rStart, totalDays } = getRenderBounds();
        const labelW = window.innerWidth <= 720 ? 160 : 220;
        const oldColw = getColWidth(zoom, totalDays);
        lastScrollCenterIdx = rStart + (el.scrollLeft - labelW + el.clientWidth / 2) / oldColw;
    }
    render();
}

function scrollToToday() {
  requestAnimationFrame(() => {
    const el = document.querySelector('.gantt-scroll'); if (!el) return;
    const { rStart, totalDays } = getRenderBounds();
    const colw = getColWidth(zoom, totalDays);
    const todayIdx = todayBangkokIndex();
    el.scrollLeft = Math.max(0, (todayIdx - rStart) * colw + 220 - el.clientWidth / 2);
  });
}

function buildGridBg(colw, rStart, rEnd, totalDays, zoom) {
    const bg = document.createElement('div');
    bg.className = 'gantt-grid-bg';
    bg.style.width = (totalDays * colw) + 'px';

    if (zoom === 'day' || zoom === 'week') {
        for (let i = rStart; i <= rEnd; i++) {
            const line = document.createElement('div');
            line.className = 'grid-line'; line.style.left = ((i - rStart) * colw) + 'px';
            bg.appendChild(line);
        }
    } else if (zoom === 'month') {
        const weeks = weekSegmentsBounded(rStart, rEnd);
        weeks.forEach(w => {
            const line = document.createElement('div');
            line.className = 'grid-line'; line.style.left = ((w.start - rStart) * colw) + 'px';
            bg.appendChild(line);
        });
    } else if (zoom === 'year') {
        const { months } = headerGroupsBounded(rStart, rEnd);
        months.forEach(m => {
            const line = document.createElement('div');
            line.className = 'grid-line'; line.style.left = ((m.start - rStart) * colw) + 'px';
            bg.appendChild(line);
        });
    }
    return bg;
}

function buildHeader(colw, rStart, rEnd, totalDays, labelText = 'หน่วยงาน / ชื่องาน') {
  const { years, months } = headerGroupsBounded(rStart, rEnd), totalWidth = totalDays * colw;
  const header = document.createElement('div'); header.className = 'gantt-header';

  const yearRow = document.createElement('div'); yearRow.className = 'header-row year-row'; yearRow.innerHTML = `<div class="row-label corner">${labelText}</div>`;
  const yTrack = document.createElement('div'); yTrack.className = 'row-track'; yTrack.style.width = totalWidth + 'px';

  yearRow.appendChild(yTrack); header.appendChild(yearRow);

  if (zoom !== 'year') {
    const monthRow = document.createElement('div'); monthRow.className = 'header-row month-row'; monthRow.innerHTML = `<div class="row-label corner"></div>`;
    const mTrack = document.createElement('div'); mTrack.className = 'row-track'; mTrack.style.width = totalWidth + 'px';
    months.forEach(m => { const seg = document.createElement('div'); seg.className = 'hdr-seg month-seg'; seg.style.width = ((m.end - m.start + 1) * colw) + 'px'; seg.textContent = m.label; mTrack.appendChild(seg); });
    monthRow.appendChild(mTrack); header.appendChild(monthRow);
  }

  if (zoom === 'week') {
    const weekRow = document.createElement('div'); weekRow.className = 'header-row week-row'; weekRow.innerHTML = `<div class="row-label corner"></div>`;
    const wTrack = document.createElement('div'); wTrack.className = 'row-track'; wTrack.style.width = totalWidth + 'px';
    weekSegmentsBounded(rStart, rEnd).forEach(seg0 => { const seg = document.createElement('div'); seg.className = 'hdr-seg week-seg'; seg.style.width = ((seg0.end - seg0.start + 1) * colw) + 'px'; seg.textContent = seg0.label; wTrack.appendChild(seg); });
    weekRow.appendChild(wTrack); header.appendChild(weekRow);
  }

  if (zoom === 'day') {
    const dayRow = document.createElement('div'); dayRow.className = 'header-row day-row'; dayRow.innerHTML = `<div class="row-label corner"></div>`;
    const dTrack = document.createElement('div'); dTrack.className = 'row-track'; dTrack.style.width = totalWidth + 'px';

      seg.innerHTML = `<span class="day-num">${d.getUTCDate()}</span><span class="day-dow">${THAI_WEEKDAY_SHORT[dow]}</span>`; dTrack.appendChild(seg);
    }
    dayRow.appendChild(dTrack); header.appendChild(dayRow);
  }
  return header;
}

function restoreScrollPosition(rStart, colw) {
    if (lastScrollCenterIdx !== null) {
        setTimeout(() => {
            const el = document.querySelector('.gantt-scroll');
            if (el) {
                const labelW = window.innerWidth <= 720 ? 160 : 220;
                el.scrollLeft = Math.max(0, (lastScrollCenterIdx - rStart) * colw + labelW - el.clientWidth / 2);
                lastScrollCenterIdx = null;
            }
        }, 0);
    } else {
        setTimeout(scrollToToday, 0);
    }
}

function renderLegend(targetProject = null) {
  const wrap = document.createElement('div'); wrap.className = 'legend'; wrap.innerHTML = `<span class="legend-label">สีกิจกรรม:</span>`;
  const usedColorsHex = new Set(); let hasTask = false, hasOverdue = false, hasDueToday = false, todayIdx = todayBangkokIndex();
  const targetList = targetProject ? targetProject.departments : state.projects.flatMap(p => p.departments);
  targetList.forEach(d => d.rows.forEach(r => r.activities.forEach(a => {
    usedColorsHex.add(a.color);
    if(a.type === 'task') { hasTask = true; if(!a.completed && todayIdx > a.end) hasOverdue = true; if(!a.completed && todayIdx === a.end) hasDueToday = true; }

function createSmartActivityBar(act, colw, rStart, rEnd, totalWidth, rowActivities, project, dept, row) {
  const actStart = Math.max(rStart, act.start);
  const actEnd = Math.min(rEnd, act.end);
  if (actEnd < rStart || actStart > rEnd) return null;

  const actStartOffset = (actStart - rStart) * colw;
  const actWidth = Math.max(colw, (actEnd - actStart + 1) * colw - 2);

  const sortedActs = [...rowActivities].sort((a, b) => a.start - b.start || a.end - b.end);
  const myIndex = sortedActs.findIndex(a => a.id === act.id);
  const nextAct = sortedActs[myIndex + 1];
  
  let spaceToNext = totalWidth - actStartOffset;
  if (nextAct) {
      const nextStartOffset = (nextAct.start - rStart) * colw;
      spaceToNext = Math.max(actWidth, nextStartOffset - actStartOffset - 2);
  }

  const todayIdx = todayBangkokIndex(); 
  let displayColor = act.color, prefix = '', statusText = '';
  if (act.type === 'task') {
      if (act.completed) { prefix = '✅ '; statusText = ' (เสร็จสิ้น)'; }
      else {
          if (todayIdx > act.end) { displayColor = '#EF4444'; prefix = '🚨 '; statusText = ' (เลยกำหนด!)'; }
          else if (todayIdx === act.end) { displayColor = '#F59E0B'; prefix = '🔥 '; statusText = ' (ครบกำหนดวันนี้!)'; }
          else { prefix = '📌 '; statusText = ' (รอดำเนินการ)'; }
      }
  }

  const bar = document.createElement('div');
  bar.className = 'act-bar' + (dragMode && project ? ' draggable' : '');
  bar.style.position = 'absolute';
  bar.style.left = actStartOffset + 'px';
  bar.style.width = 'max-content';
  bar.style.minWidth = actWidth + 'px';
  bar.style.maxWidth = spaceToNext + 'px'; 
  bar.title = `${prefix}${act.label}${statusText}${act.remark ? '\n📝 หมายเหตุ: ' + act.remark : ''}`;
  bar.style.background = 'transparent';
  bar.style.border = 'none'; 
  bar.style.padding = '0';
  bar.style.boxSizing = 'border-box';
  bar.style.overflow = 'hidden'; 

  let rHex = parseInt(displayColor.slice(1, 3), 16) || 0;
  let gHex = parseInt(displayColor.slice(3, 5), 16) || 0;
  let bHex = parseInt(displayColor.slice(5, 7), 16) || 0;
  let lightBg = `rgba(${rHex}, ${gHex}, ${bHex}, 0.15)`;

  const dashedFill = document.createElement('div');
  dashedFill.style.position = 'absolute';
  dashedFill.style.inset = '0';
  dashedFill.style.background = lightBg;
  dashedFill.style.border = `1.5px dashed ${displayColor}`;
  dashedFill.style.borderRadius = '6px';
  dashedFill.style.zIndex = '0';
  dashedFill.style.boxSizing = 'border-box';

  const solidFill = document.createElement('div');
  solidFill.style.position = 'absolute';
  solidFill.style.left = '0'; 
  solidFill.style.top = '0'; 
  solidFill.style.bottom = '0'; 
  solidFill.style.width = actWidth + 'px'; 
  solidFill.style.background = displayColor;
  solidFill.style.border = `1.5px solid ${displayColor}`; 
  solidFill.style.borderRadius = '6px';
  solidFill.style.zIndex = '1';
  solidFill.style.boxSizing = 'border-box';

  const textSpan = document.createElement('span');
  textSpan.style.position = 'relative';
  textSpan.style.zIndex = '2';
  textSpan.style.padding = '0 8px';
  textSpan.style.whiteSpace = 'nowrap';
  textSpan.style.overflow = 'hidden';
  textSpan.style.textOverflow = 'ellipsis';
  textSpan.style.color = '#14213A';
  textSpan.style.textShadow = '0 0 3px rgba(255,255,255,0.9), 0 0 1px rgba(255,255,255,1)';
  textSpan.textContent = prefix + act.label;
  textSpan.style.display = 'block'; 
  textSpan.style.width = '100%';

  bar.appendChild(dashedFill);
  bar.appendChild(solidFill);
  bar.appendChild(textSpan);

  if (dragMode && project) {
      const startDrag = (e) => {
          e.stopPropagation(); 
          let clientX = e.clientX;
          if (e.touches && e.touches.length > 0) clientX = e.touches[0].clientX;
          let startX = clientX, initialActStart = act.start, duration = act.end - act.start, hasMoved = false;
          
          function onMove(moveEvent) {
              let curX = moveEvent.clientX;
              if (moveEvent.touches && moveEvent.touches.length > 0) curX = moveEvent.touches[0].clientX;
              let dx = curX - startX, dayShift = Math.round(dx / colw);
              if (dayShift !== 0) {
                  hasMoved = true; 
                  act.start = initialActStart + dayShift; 
                  act.end = act.start + duration;
                  let curStart = Math.max(rStart, act.start), curEnd = Math.min(rEnd, act.end);
                  let newOffset = (curStart - rStart) * colw;
                  let newWidth = Math.max(colw, (curEnd - curStart + 1) * colw - 2);
                  
                  bar.style.left = newOffset + 'px';
                  bar.style.minWidth = newWidth + 'px';
                  solidFill.style.width = newWidth + 'px';
                  
                  const curSortedActs = [...rowActivities].sort((a, b) => a.start - b.start || a.end - b.end);
                  const curMyIndex = curSortedActs.findIndex(a => a.id === act.id);
                  const curNextAct = curSortedActs[curMyIndex + 1];
                  
                  let curSpaceToNext = totalWidth - newOffset;
                  if (curNextAct) {
                      const nextStartOffset = (curNextAct.start - rStart) * colw;
                      curSpaceToNext = Math.max(newWidth, nextStartOffset - newOffset - 2);
                  }
                  bar.style.maxWidth = curSpaceToNext + 'px';
              }
          }
          
          function onEnd() { 
              window.removeEventListener('mousemove', onMove); 
              window.removeEventListener('mouseup', onEnd); 
              window.removeEventListener('touchmove', onMove); 
              window.removeEventListener('touchend', onEnd); 
              if (hasMoved) persistAndRender(); 
          }
          
          window.addEventListener('mousemove', onMove); 
          window.addEventListener('mouseup', onEnd);
          window.addEventListener('touchmove', onMove, { passive: false }); 
          window.addEventListener('touchend', onEnd);
      };
      bar.onmousedown = startDrag;
      bar.addEventListener('touchstart', startDrag, { passive: true });
  } else if (project) {
      bar.onclick = (e) => { e.stopPropagation(); openActivityModal(project.id, dept.id, row.id, act.id); };
  }

  return bar;
}

function buildSubrow(project, dept, row, colw, totalWidth, rStart, rEnd) {
  const track = document.createElement('div'); track.className = 'subrow'; track.style.width = totalWidth + 'px';
  track.onclick = (e) => { if (e.target === track && project) openActivityModal(project.id, dept.id, row.id, null); };

  row.activities.forEach(act => {
    const bar = createSmartActivityBar(act, colw, rStart, rEnd, totalWidth, row.activities, project, dept, row);
    if (bar) track.appendChild(bar);
  });

  if (project && dept.rows.length > 1 && dragMode) {
    const delRowBtn = document.createElement('button'); delRowBtn.className = 'row-del-btn'; delRowBtn.textContent = '×';
    delRowBtn.onclick = (e) => { e.stopPropagation(); deleteRow(project.id, dept.id, row.id); }; track.appendChild(delRowBtn);
  }
  return track;
}

function openActivityModal(projectId, deptId, rowId, actId) {

    <div style="display:flex; gap:6px; align-items:center;">

  if (existing) {
    const delBtn = document.createElement('button'); delBtn.className = 'danger-btn'; delBtn.textContent = 'ลบกิจกรรม';
    delBtn.onclick = async () => { r.activities = r.activities.filter(a => a.id !== existing.id); closeModal(overlay); await persistAndRender(); };
    actions.appendChild(delBtn);
  }
  const cancelBtn = document.createElement('button'); cancelBtn.className = 'ghost-btn'; cancelBtn.textContent = 'ยกเลิก'; cancelBtn.onclick = () => closeModal(overlay); actions.appendChild(cancelBtn);
}

async function moveDepartmentUp(projectId, deptId) {
  const p = state.projects.find(x => x.id === projectId); const idx = p.departments.findIndex(x => x.id === deptId);
  if (idx > 0) { const temp = p.departments[idx - 1]; p.departments[idx - 1] = p.departments[idx]; p.departments[idx] = temp; await persistAndRender(); }
}
async function moveDepartmentDown(projectId, deptId) {
  const p = state.projects.find(x => x.id === projectId); const idx = p.departments.findIndex(x => x.id === deptId);
  if (idx < p.departments.length - 1) { const temp = p.departments[idx + 1]; p.departments[idx + 1] = p.departments[idx]; p.departments[idx] = temp; await persistAndRender(); }
}

    if (!name) return; const newProj = seedProject(name, [mkDept('หน่วยงาน PRI', [mkRow([])])], 'extra');

function renameProject(id) { const p = state.projects.find(x => x.id === id); openTextModal('เปลี่ยนชื่อโครงการ', 'ชื่อโครงการ', p.name, async (name) => { if (!name) return; p.name = name; await persistAndRender(); }); }
function deleteProject(id) { openConfirmModal('ลบโครงการนี้?', 'ข้อมูลทั้งหมดจะถูกลบ', async () => { state.projects = state.projects.filter(p => p.id !== id); if (view.type === 'project' && view.id === id) view = { type: 'overview' }; await persistAndRender(); }); }
function openProjectColorModal(projectId) {
  const p = state.projects.find(x => x.id === projectId); if (!p) return;
  modalOpen = true; const overlay = document.createElement('div'); overlay.className = 'modal-overlay'; const modal = document.createElement('div'); modal.className = 'modal';
  modal.innerHTML = `<h3>เลือกสีแท็บโครงการ: ${escapeHTML(p.name)}</h3><label class="field-label">เลือกสีประจำโครงการ</label><div class="color-picker" id="projColorPicker" style="margin-bottom:20px;"></div><div class="modal-actions" id="modalActions"></div>`;
  overlay.appendChild(modal); document.body.appendChild(overlay);
  let chosenColor = p.color || '#3A2E6E'; const picker = modal.querySelector('#projColorPicker');
  const allProjectColors = [ { hex: '#3A2E6E' }, { hex: '#241C4D' }, { hex: '#22D3EE' }, { hex: '#34D399' }, { hex: '#EC4899' }, { hex: '#3B82F6' }, { hex: '#FBBF24' }, { hex: '#8B5CF6' }, { hex: '#EF4444' }, { hex: '#6B7280' } ];
  allProjectColors.forEach(c => {
    const sw = document.createElement('div'); sw.className = 'color-swatch' + (c.hex === chosenColor ? ' selected' : ''); sw.style.background = c.hex;
    sw.onclick = () => { chosenColor = c.hex; [...picker.children].forEach(ch => ch.classList.remove('selected')); sw.classList.add('selected'); }; picker.appendChild(sw);
  });
  const actions = modal.querySelector('#modalActions'), saveBtn = document.createElement('button'); saveBtn.className = 'primary-btn'; saveBtn.textContent = 'บันทึกสี';
  saveBtn.onclick = async () => { p.color = chosenColor; closeModal(overlay); await persistAndRender(); }; actions.appendChild(saveBtn);
  const cancelBtn = document.createElement('button'); cancelBtn.className = 'ghost-btn'; cancelBtn.textContent = 'ยกเลิก'; cancelBtn.onclick = () => closeModal(overlay); actions.appendChild(cancelBtn);
}
function openOverviewSettingsModal(tabKey) {
  const setting = state.overviewSettings[tabKey]; modalOpen = true;
  const overlay = document.createElement('div'); overlay.className = 'modal-overlay'; const modal = document.createElement('div'); modal.className = 'modal';
  modal.innerHTML = `<h3>แก้ไขแท็บภาพรวม</h3><label class="field-label">ชื่อแท็บ</label><input type="text" id="ovNameInput" class="text-input" value="${escapeHTML(setting.name)}"><label class="field-label" style="margin-top:12px;">เลือกสีประจำแท็บ</label><div class="color-picker" id="ovColorPicker" style="margin-bottom:20px;"></div><div class="modal-actions" id="modalActions"></div>`;
  overlay.appendChild(modal); document.body.appendChild(overlay);
  let chosenColor = setting.color || ''; const picker = modal.querySelector('#ovColorPicker');
  const allProjectColors = [ { hex: '' }, { hex: '#3A2E6E' }, { hex: '#241C4D' }, { hex: '#22D3EE' }, { hex: '#34D399' }, { hex: '#EC4899' }, { hex: '#3B82F6' }, { hex: '#FBBF24' }, { hex: '#8B5CF6' }, { hex: '#EF4444' }, { hex: '#6B7280' } ];
  allProjectColors.forEach(c => {
    const sw = document.createElement('div'); sw.className = 'color-swatch' + (c.hex === chosenColor ? ' selected' : '');
    if (c.hex === '') { sw.style.background = '#F3F5F9'; sw.style.border = '1px solid #E1E4EC'; sw.textContent = '🚫'; sw.style.display = 'flex'; sw.style.alignItems = 'center'; sw.style.justifyContent = 'center'; sw.style.fontSize = '12px'; sw.title = 'ยกเลิกสี'; }
    else { sw.style.background = c.hex; }

  const cancelBtn = document.createElement('button'); cancelBtn.className = 'ghost-btn'; cancelBtn.textContent = 'ยกเลิก'; cancelBtn.onclick = () => closeModal(overlay); actions.appendChild(cancelBtn);
}
function editColorsModal() {
  modalOpen = true; const overlay = document.createElement('div'); overlay.className = 'modal-overlay'; const modal = document.createElement('div'); modal.className = 'modal';
  let html = `<h3>แก้ไขชื่อสี</h3><div style="display:flex; flex-direction:column; gap:10px; margin-bottom:16px;">`;

  html += `</div><div class="modal-actions" id="modalActions"></div>`; modal.innerHTML = html; overlay.appendChild(modal); document.body.appendChild(overlay);
  const actions = modal.querySelector('#modalActions'), saveBtn = document.createElement('button'); saveBtn.className = 'primary-btn'; saveBtn.textContent = 'บันทึกการตั้งค่า';
  saveBtn.onclick = async () => { state.colors.forEach((c, idx) => { const val = document.getElementById(`cname_${idx}`).value.trim(); if(val) c.name = val; }); closeModal(overlay); await persistAndRender(); }; actions.appendChild(saveBtn);
  const cancelBtn = document.createElement('button'); cancelBtn.className = 'ghost-btn'; cancelBtn.textContent = 'ยกเลิก'; cancelBtn.onclick = () => closeModal(overlay); actions.appendChild(cancelBtn);

function addDepartment(projectId) { openTextModal('เพิ่มหน่วยงาน', 'ชื่อหน่วยงาน', '', async (name) => { if (!name) return; state.projects.find(x => x.id === projectId).departments.push(mkDept(name, [mkRow([])])); await persistAndRender(); }); }
function renameDepartment(projectId, deptId) { const d = state.projects.find(x => x.id === projectId).departments.find(x => x.id === deptId); openTextModal('เปลี่ยนชื่อหน่วยงาน', 'ชื่อหน่วยงาน', d.name, async (name) => { if (!name) return; d.name = name; await persistAndRender(); }); }
function deleteDepartment(projectId, deptId) { openConfirmModal('ลบหน่วยงานนี้?', 'กิจกรรมทั้งหมดในหน่วยงานจะถูกลบ', async () => { state.projects.find(x => x.id === projectId).departments = state.projects.find(x => x.id === projectId).departments.filter(d => d.id !== deptId); await persistAndRender(); }); }
function addRow(projectId, deptId) { const d = state.projects.find(x => x.id === projectId).departments.find(x => x.id === deptId); d.rows.push(mkRow([], `แถว ${d.rows.length + 1}`)); persistAndRender(); }
function renameRow(projectId, deptId, rowId) { const r = state.projects.find(x => x.id === projectId).departments.find(x => x.id === deptId).rows.find(x => x.id === rowId); openTextModal('เปลี่ยนชื่อแถว', 'ชื่อสำหรับแถวนี้', r.name, async (name) => { r.name = name || 'แถว'; await persistAndRender(); }); }
function deleteRow(projectId, deptId, rowId) { openConfirmModal('ลบแถวนี้?', 'กิจกรรมจะถูกลบ', async () => { const d = state.projects.find(x => x.id === projectId).departments.find(x => x.id === deptId); d.rows = d.rows.filter(r => r.id !== rowId); if (d.rows.length === 0) d.rows.push(mkRow([], 'แถว 1')); await persistAndRender(); }); }
function openTextModal(title, fieldLabel, initial, onSave) {
  modalOpen = true; const overlay = document.createElement('div'); overlay.className = 'modal-overlay'; const modal = document.createElement('div'); modal.className = 'modal';
  modal.innerHTML = `<h3>${escapeHTML(title)}</h3><label class="field-label">${escapeHTML(fieldLabel)}</label><input type="text" id="txtInput" class="text-input" value="${escapeHTML(initial)}"><div class="modal-actions" id="modalActions"></div>`;
  overlay.appendChild(modal); document.body.appendChild(overlay); const input = modal.querySelector('#txtInput'); setTimeout(() => input.focus(), 0);
  const actions = modal.querySelector('#modalActions'), saveBtn = document.createElement('button'); saveBtn.className = 'primary-btn'; saveBtn.textContent = 'บันทึก';
  const doSave = () => { closeModal(overlay); onSave(input.value.trim()); }; saveBtn.onclick = doSave; input.onkeydown = (e) => { if (e.key === 'Enter') doSave(); }; actions.appendChild(saveBtn);
  const cancelBtn = document.createElement('button'); cancelBtn.className = 'ghost-btn'; cancelBtn.textContent = 'ยกเลิก'; cancelBtn.onclick = () => closeModal(overlay); actions.appendChild(cancelBtn);
}
function openConfirmModal(title, desc, onConfirm) {
  modalOpen = true; const overlay = document.createElement('div'); overlay.className = 'modal-overlay'; const modal = document.createElement('div'); modal.className = 'modal';
  modal.innerHTML = `<h3>${escapeHTML(title)}</h3><p class="modal-desc">${escapeHTML(desc)}</p><div class="modal-actions" id="modalActions"></div>`;
  overlay.appendChild(modal); document.body.appendChild(overlay);
  const actions = modal.querySelector('#modalActions'), confirmBtn = document.createElement('button'); confirmBtn.className = 'danger-btn'; confirmBtn.textContent = 'ยืนยัน';
  confirmBtn.onclick = async () => { closeModal(overlay); await onConfirm(); }; actions.appendChild(confirmBtn);
  const cancelBtn = document.createElement('button'); cancelBtn.className = 'ghost-btn'; cancelBtn.textContent = 'ยกเลิก'; cancelBtn.onclick = () => closeModal(overlay); actions.appendChild(cancelBtn);
}
function closeModal(overlay) { modalOpen = false; overlay.remove(); }
init();
